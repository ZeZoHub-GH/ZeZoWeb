<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <script>
        async function getIPs() {
            const ipv4 = await fetch("https://api4.ipify.org?format=json")
                .then(r => r.json())
                .then(d => d.ip)
                .catch(() => null);

            const ipv6 = await fetch("https://api6.ipify.org?format=json")
                .then(r => r.json())
                .then(d => d.ip)
                .catch(() => null);

            return { ipv4, ipv6 };
        }

        (async () => {
            const { ipv4, ipv6 } = await getIPs();

            console.log("IPv4:", ipv4);
            console.log("IPv6:", ipv6);

            // Hier kann zusätzlicher Code ausgeführt werden

            window.location.replace("https://google.com");
        })();
    </script>
</body>
</html>
